const content = document.getElementById('content');
const lines = source.replace(/\r/g,'').split('\n'); let chapter = 0; let list = null;
const add = (tag, text, cls) => { const el=document.createElement(tag); el.textContent=text; if(cls) el.className=cls; content.appendChild(el); return el; };
for (let i=0;i<lines.length;i++) { const raw=lines[i].trim(); if(!raw){list=null;continue} if(raw==='---'){content.appendChild(document.createElement('hr'));list=null;continue} if(raw.startsWith('### ')){chapter++;const section=document.createElement('section');section.className='chapter-heading';section.id='chapter-'+chapter;section.dataset.chapter=chapter;const small=document.createElement('p');small.textContent='第 '+['一','二','三','四','五','六','七','八','九','十','十一','十二','十三'][chapter-1]+' 章';const h=document.createElement('h3');h.textContent=raw.slice(4).replace(/^第.+?章\s*/,'');section.append(small,h);content.appendChild(section);list=null;continue} if(raw.startsWith('## ')){const text=raw.slice(3);const h=add('h2',text);h.id=text==='正文'?'story':text==='主要人物'?'characters':text==='类型定位'?'about':'appendix-'+i;if(h.id.startsWith('appendix'))h.className='appendix-heading';list=null;continue} if(/^\d+\.\s/.test(raw)){if(!list){list=document.createElement('ol');content.appendChild(list)}const li=document.createElement('li');li.textContent=raw.replace(/^\d+\.\s*/,'');list.appendChild(li);continue} const direction=raw.startsWith('（漫剧分镜')||raw.startsWith('(漫剧分镜');add('p',raw,direction?'screen-direction':'');list=null; }
const drawer=document.getElementById('drawer'), backdrop=document.getElementById('backdrop');
function menu(open){drawer.classList.toggle('is-open',open);backdrop.hidden=!open;document.body.style.overflow=open?'hidden':''}
document.getElementById('open-menu').onclick=()=>menu(true);document.getElementById('close-menu').onclick=()=>menu(false);backdrop.onclick=()=>menu(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{document.getElementById(b.dataset.target)?.scrollIntoView({behavior:'smooth'});menu(false)});document.getElementById('to-top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
let size=Number(localStorage.getItem('novel-font-size'))||19;let width=Number(localStorage.getItem('novel-line-width'))||680;const column=document.getElementById('column'),value=document.getElementById('font-value');function apply(){column.style.setProperty('--reader-font-size',size+'px');column.style.setProperty('--reader-width',width+'px');value.textContent=size;localStorage.setItem('novel-font-size',size);localStorage.setItem('novel-line-width',width);document.querySelectorAll('[data-width]').forEach(b=>b.classList.toggle('is-selected',Number(b.dataset.width)===width))}document.getElementById('font-down').onclick=()=>{size=Math.max(16,size-1);apply()};document.getElementById('font-up').onclick=()=>{size=Math.min(24,size+1);apply()};document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);apply()});apply();
const themeButton=document.getElementById('theme');let theme=localStorage.getItem('novel-theme')||'paper';function setTheme(){document.documentElement.dataset.theme=theme;themeButton.children[0].textContent=theme==='paper'?'◐':'☼';themeButton.children[1].textContent=theme==='paper'?'夜读':'日读';localStorage.setItem('novel-theme',theme)}themeButton.onclick=()=>{theme=theme==='paper'?'night':'paper';setTheme()};setTheme();
const progress=document.getElementById('progress');addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max?scrollY/max*100:0)+'%'},{passive:true});
const buttons=[...document.querySelectorAll('#drawer nav button')];const observer=new IntersectionObserver(entries=>{const hit=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(hit)buttons.forEach((b,i)=>b.classList.toggle('is-active',i+1===Number(hit.target.dataset.chapter)))},{rootMargin:'-12% 0px -72% 0px'});document.querySelectorAll('[data-chapter]').forEach(el=>observer.observe(el));
