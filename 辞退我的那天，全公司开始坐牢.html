const content = document.getElementById('content');
const lines = source.replace(/\r/g,'').split('\n'); let chapter = 0; let list = null; let inFrontMatter = lines[0]?.trim() === '---';

let size=Number(localStorage.getItem('novel-font-size'))||19;let width=Number(localStorage.getItem('novel-line-width'))||680;const column=document.getElementById('column'),value=document.getElementById('font-value');function apply(){column.style.setProperty('--reader-font-size',size+'px');column.style.setProperty('--reader-width',width+'px');value.textContent=size;localStorage.setItem('novel-font-size',size);localStorage.setItem('novel-line-width',width);document.querySelectorAll('[data-width]').forEach(b=>b.classList.toggle('is-selected',Number(b.dataset.width)===width))}document.getElementById('font-down').onclick=()=>{size=Math.max(16,size-1);apply()};document.getElementById('font-up').onclick=()=>{size=Math.min(24,size+1);apply()};document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);apply()});apply();
const themeButton=document.getElementById('theme');let theme=localStorage.getItem('novel-theme')||'paper';function setTheme(){document.documentElement.dataset.theme=theme;themeButton.children[0].textContent=theme==='paper'?'◐':'☼';themeButton.children[1].textContent=theme==='paper'?'夜读':'日读';localStorage.setItem('novel-theme',theme)}themeButton.onclick=()=>{theme=theme==='paper'?'night':'paper';setTheme()};setTheme();
const progress=document.getElementById('progress');addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max?scrollY/max*100:0)+'%'},{passive:true});
const buttons=[...document.querySelectorAll('#drawer nav button')];const observer=new IntersectionObserver(entries=>{const hit=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(hit)buttons.forEach((b,i)=>b.classList.toggle('is-active',i+1===Number(hit.target.dataset.chapter)))},{rootMargin:'-12% 0px -72% 0px'});document.querySelectorAll('[data-chapter]').forEach(el=>observer.observe(el));
</script></body></html>
